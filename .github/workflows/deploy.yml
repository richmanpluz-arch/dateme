name: Build DateMe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dateme-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build DateMe
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://xpyjxwcergdwjybdhjbf.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_I1K5SalJTaaUBCnmRFP3Cw_9zvtPOFS
